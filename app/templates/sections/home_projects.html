{% import "components/cards.html" as cards with context %}
<section class="section" id="work" aria-labelledby="work-title">
  <div class="container">
    <header class="section__header section__header--split">
      <div>
        <p class="section__index" aria-hidden="true">02</p>
        <h2 id="work-title" class="section__title">Selected work</h2>
      </div>
      {#- Hidden until filters.js runs: without JS the buttons would do nothing. #}
      <div class="filters" role="group" aria-label="Filter projects by track" data-filters hidden>
        <button type="button" class="pill" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="pill track--academic" data-filter="academic" aria-pressed="false">
          <span class="track-dot" aria-hidden="true"></span>Research
        </button>
        <button type="button" class="pill track--professional" data-filter="professional" aria-pressed="false">
          <span class="track-dot" aria-hidden="true"></span>Professional
        </button>
      </div>
    </header>

    <div class="project-grid" data-filter-grid>
      {%- for project in featured %}
      {{ cards.project_card(project, level=3, delay=loop.index0 % 2) }}
      {%- endfor %}
    </div>
    <p class="visually-hidden" aria-live="polite" data-filter-status></p>

    <p class="section__more">
      <a class="text-link" href="{{ url_for('projects.list_projects', kind='academic') }}">All research <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
      <a class="text-link" href="{{ url_for('projects.list_projects', kind='professional') }}">All work <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
    </p>
  </div>
</section>
